# Render blueprint.
#
# Deploys with NO secrets at all: the in-process PayPal gateway and the
# deterministic engine, both labelled as such in the header. That is the point
# of the hosted demo - a judge can click through the whole five-step flow
# without installing anything or creating an account.
#
# Two honest notes about what the hosted version is and is not:
#
# * The AI engine. Locally Hito runs qwen2.5:3b on your own machine, and a
#   ~2 GB model does not fit a free Render instance. So the hosted demo runs
#   the SAME open-weights family through an OpenAI-compatible endpoint: set
#   HITO_REMOTE_BASE_URL and HITO_REMOTE_API_KEY in the dashboard and a judge
#   who only clicks the link still sees a model working. Leave them unset and
#   it falls back to the deterministic engine, labelled as such.
#   See docs/OPEN_MODEL.md.
# * The free plan has no persistent disk, so SQLite lives in the container and
#   resets on every deploy and every cold start. That is fine for a demo and
#   wrong for anything else; the `disk` block below is commented out and is
#   what you would add on a paid plan.
services:
  - type: web
    name: hito
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYOUT_APPROVAL_THRESHOLD_USD
        value: "800"
      # No Ollama on a free instance, so do not sit there probing for a local
      # model server that will never answer. "auto" still finds the hosted
      # model below when it is configured, and the rule engine when it is not.
      - key: HITO_LLM_PROVIDER
        value: auto
      # Qwen3 32B: Apache-2.0 open weights, structured outputs, and about
      # $0.0003 per full demo run. Any OpenAI-compatible endpoint works.
      - key: HITO_REMOTE_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: HITO_REMOTE_MODEL
        value: qwen/qwen3-32b
      # Set this in the dashboard. Without it, the deterministic engine runs.
      - key: HITO_REMOTE_API_KEY
        sync: false
      # Set these in the Render dashboard to point the hosted demo at your real
      # PayPal sandbox. Left unset, it runs the in-process gateway and says so.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_INVOICER_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Optional: Claude instead, if you would rather.
      - key: ANTHROPIC_API_KEY
        sync: false

    # Paid plans only - a free web service cannot mount a disk, and including
    # this block makes the blueprint fail to apply.
    # disk:
    #   name: hito-data
    #   mountPath: /var/data
    #   sizeGB: 1
